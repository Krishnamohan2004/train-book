apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-book
  namespace: krishna
spec:
  replicas: 2
  selector:
    matchLabels:
      app: train-book
  template:
    metadata:
      labels:
        app: train-book
    spec:
      containers:
      - name: train-book
        image: krishnamohan2004/vcube
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
