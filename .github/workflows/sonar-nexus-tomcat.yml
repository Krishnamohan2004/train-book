
name: Complete CI/CD - SonarQube Nexus Tomcat

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ==========================================================
  # BUILD + TEST + SONARQUBE + NEXUS
  # ==========================================================

  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4


      # Setup Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # Build and Test
      - name: Build & Test with Maven
        run: |
          mvn clean verify


      # SonarQube
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=train-ticket-reservation \
            -Dsonar.projectName=train-ticket-reservation \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


      # Configure Maven for Nexus
      - name: Configure Maven Settings
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF


      # Deploy WAR to Nexus
      - name: Deploy to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}

        run: |
          mvn deploy \
            -DskipTests \
            -DaltDeploymentRepository=nexus::${NEXUS_URL}


      # Upload WAR for Tomcat deployment
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4

        with:
          name: war-file
          path: target/*.war



  # ==========================================================
  # DEPLOY TO TOMCAT
  # ==========================================================

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # Download WAR
      - name: Download WAR artifact
        uses: actions/download-artifact@v4

        with:
          name: war-file


      # Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          URL: ${{ secrets.TOMCAT_URL }}
          USER: ${{ secrets.TOMCAT_USER }}
          PASS: ${{ secrets.TOMCAT_PASS }}

        run: |

          WAR_FILE=$(ls *.war | head -n 1)

          echo "======================================"
          echo "Deploying $WAR_FILE to Tomcat"
          echo "======================================"

          curl -u "$USER:$PASS" \
            --fail \
            -T "$WAR_FILE" \
            "$URL/deploy?path=/train-ticket-reservation&update=true"

          echo "======================================"
          echo "Tomcat Deployment Successful"
          echo "======================================"
