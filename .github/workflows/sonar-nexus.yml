
name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build and test
      - name: Build & Test with Maven
        run: mvn clean verify

      # 4. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # 5. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      # 6. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          URL: ${{ secrets.TOMCAT_URL }}
          USER: ${{ secrets.TOMCAT_USER }}
          PASS: ${{ secrets.TOMCAT_PASS }}

        run: |

          WAR_FILE=$(ls *.war | head -n 1)

          echo "Deploying $WAR_FILE to Tomcat"

          curl -u "$USER:$PASS" \
            --fail \
            -T "$WAR_FILE" \
            "$URL/deploy?path=/train-ticket-reservation&update=true"

          echo "Deployment successful!"
