
name: Build and Deploy to DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Maven Project
        run: mvn clean verify

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to DEV Tomcat
        env:
          URL: ${{ secrets.TOMCAT_URL_DEV }}
          USER: ${{ secrets.TOMCAT_USER_DEV }}
          PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          test -n "$WAR_FILE" || exit 1

          echo "Deploying to DEV"

          curl --show-error --fail-with-body \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"
