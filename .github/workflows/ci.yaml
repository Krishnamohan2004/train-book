
name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - main
      - test
      - pre-prod
      - prod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Verify WAR file
        run: |
          ls -lh target/*.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war
          if-no-files-found: error

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to DEV
        env:
          URL: ${{ secrets.TOMCAT_URL_DEV }}
          USER: ${{ secrets.TOMCAT_USER_DEV }}
          PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          test -n "$WAR_FILE" || {
            echo "WAR file not found"
            exit 1
          }

          echo "Deploying $WAR_FILE to DEV"

          curl --show-error --fail-with-body \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"

  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: TEST

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to TEST
        env:
          URL: ${{ secrets.TOMCAT_URL_TEST }}
          USER: ${{ secrets.TOMCAT_USER_TEST }}
          PASS: ${{ secrets.TOMCAT_PASS_TEST }}
        run: |
          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          test -n "$WAR_FILE" || {
            echo "WAR file not found"
            exit 1
          }

          echo "Deploying $WAR_FILE to TEST"

          curl --show-error --fail-with-body \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"

  deploy-pre-prod:
    needs: build
    if: github.ref == 'refs/heads/pre-prod'
    runs-on: ubuntu-latest
    environment: PRE-PROD

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PRE-PROD
        env:
          URL: ${{ secrets.TOMCAT_URL_PRE_PROD }}
          USER: ${{ secrets.TOMCAT_USER_PRE_PROD }}
          PASS: ${{ secrets.TOMCAT_PASS_PRE_PROD }}
        run: |
          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          test -n "$WAR_FILE" || {
            echo "WAR file not found"
            exit 1
          }

          echo "Deploying $WAR_FILE to PRE-PROD"

          curl --show-error --fail-with-body \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PROD
        env:
          URL: ${{ secrets.TOMCAT_URL_PROD }}
          USER: ${{ secrets.TOMCAT_USER_PROD }}
          PASS: ${{ secrets.TOMCAT_PASS_PROD }}
        run: |
          WAR_FILE=$(find . -name "*.war" -type f | head -n 1)

          test -n "$WAR_FILE" || {
            echo "WAR file not found"
            exit 1
          }

          echo "Deploying $WAR_FILE to PROD"

          curl --show-error --fail-with-body \
            -u "$USER:$PASS" \
            -T "$WAR_FILE" \
            "$URL/manager/text/deploy?path=/train-ticket-reservation&update=true"
