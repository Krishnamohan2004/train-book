name: CI - Maven, SonarQube, Nexus, Tomcat

on:
	push:
		branches: [ main ]
	pull_request:
		branches: [ main ]

jobs:
	build:
		runs-on: ubuntu-latest
		env:
			NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
			NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
			NEXUS_UPLOAD_URL: ${{ secrets.NEXUS_UPLOAD_URL }}
			SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
			SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
			TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
			TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
			TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up JDK 8 and cache Maven
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: '8'
					cache: maven

			- name: Copy Maven settings
				run: |
					mkdir -p ~/.m2
					if [ -f settings.xml ]; then cp settings.xml ~/.m2/settings.xml; fi

			- name: Build package
				run: mvn -B -s ~/.m2/settings.xml clean package

			- name: Run SonarQube analysis
				env:
					SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
					SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
				run: |
					mvn -B -s ~/.m2/settings.xml sonar:sonar -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}

			- name: Upload WAR to Nexus (generic upload)
				if: success()
				env:
					NEXUS_UPLOAD_URL: ${{ secrets.NEXUS_UPLOAD_URL }}
					NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
					NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
				run: |
					WAR=$(ls target/*.war | head -n1)
					if [ -z "$WAR" ]; then echo "No WAR found in target/"; exit 1; fi
					echo "Uploading $WAR to $NEXUS_UPLOAD_URL"
					curl -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" --fail --upload-file "$WAR" "$NEXUS_UPLOAD_URL/$(basename $WAR)"

			- name: Deploy WAR to Tomcat (manager)
				if: success()
				env:
					TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
					TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
					TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
				run: |
					WAR=$(ls target/*.war | head -n1)
					if [ -z "$WAR" ]; then echo "No WAR to deploy"; exit 1; fi
					APP_PATH=/TrainBook
					echo "Deploying $WAR to http://$TOMCAT_HOST/manager/text/deploy?path=$APP_PATH&update=true"
					curl --fail -u "$TOMCAT_USER:$TOMCAT_PASSWORD" "http://$TOMCAT_HOST/manager/text/deploy?path=$APP_PATH&update=true" --upload-file "$WAR"

