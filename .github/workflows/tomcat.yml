name: CI/CD Pipeline with SonarQube and Nexus

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Source Code
      # --------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------
      # 3. Build WAR File
      # --------------------------------------------------
      - name: Build Project
        run: |
          mvn clean verify


      # --------------------------------------------------
      # 4. SonarQube Scan
      # --------------------------------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=train \
            -Dsonar.projectName=TrainBook \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


      # --------------------------------------------------
      # 5. Configure Maven settings.xml for Nexus
      # --------------------------------------------------
      - name: Configure Maven settings.xml for Nexus
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF


      # --------------------------------------------------
      # 6. Verify Maven settings.xml
      # --------------------------------------------------
      - name: Verify Maven Configuration
        run: |
          echo "Maven settings.xml created successfully"
          ls -l ~/.m2/settings.xml


      # --------------------------------------------------
      # 7. Deploy WAR to Nexus
      # --------------------------------------------------
      - name: Upload Artifact to Nexus
        run: |
          mvn deploy \
            -DaltDeploymentRepository=nexus::http://52.15.98.245:8081/repository/maven-snapshots/
