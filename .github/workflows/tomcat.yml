
name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build WAR File
        run: mvn clean package

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to DEV
        env:
          URL: ${{ secrets.TOMCAT_URL_DEV }}
          USERNAME: ${{ secrets.TOMCAT_USER_DEV }}
          PASSWORD: ${{ secrets.TOMCAT_PASS_DEV }}

        run: |
          WAR_FILE=$(find . -name "*.war" | head -n 1)
          echo "Deploying $WAR_FILE"

          curl -u "$USERNAME:$PASSWORD" --upload-file "$WAR_FILE" "$URL/deploy?path=/train-ticket-reservation&update=true"

